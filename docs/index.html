<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Test App</title>
  <style>
    .muted-text {
      color: #767676;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <h1>ADA Test App</h1>
  <p>A wider spread of deliberate accessibility issues, used to test the Auto-Fix pipeline across many rule types.</p>

  <button class="icon-btn" aria-label="Menu"><svg width="16" height="16"><rect width="16" height="16" /></svg></button>

  <img class="banner-img" src="banner.svg" alt="Banner">

  <input class="search-input" type="text" placeholder="Search products">

  <a class="social-link" href="https://example.com" aria-label="Learn more"><svg width="16" height="16"><circle cx="8" cy="8" r="8" /></svg></a>

  <h3 class="section-heading">Section heading</h3>

  <p class="muted-text">Muted text with insufficient contrast</p>

  <iframe class="promo-frame" src="https://example.com/promo"></iframe>

  <select class="role-select">
    <option value="">Choose a role</option>
    <option value="dev">Developer</option>
    <option value="qa">QA</option>
  </select>
</body>
</html>
