<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ADA Test App</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    nav { background: #222; padding: 12px 20px; }
    nav a { color: #444; margin-right: 16px; text-decoration: none; }
    .content { padding: 20px; max-width: 500px; }
    .field { margin-bottom: 12px; }
    .error { border-color: red; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="media.html">Media</a>
  </nav>

  <div class="content">
    <h1>Contact us</h1>

    <form>
      <!-- label: placeholder standing in for a real label -->
      <div class="field">
        <input type="text" placeholder="Full name">
      </div>

      <!-- autocomplete-valid: invalid autocomplete token -->
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="banana">
      </div>

      <!-- error shown by color alone, no text, no aria-invalid/aria-describedby -->
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" class="error">
      </div>

      <!-- select-name: no associated label -->
      <div class="field">
        <select class="topic-select">
          <option>General question</option>
          <option>Support</option>
          <option>Billing</option>
        </select>
      </div>

      <!-- fieldset/legend missing for a radio group -->
      <div class="field">
        <input type="radio" id="contact-email" name="pref">
        <label for="contact-email">Email me</label>
        <input type="radio" id="contact-phone" name="pref">
        <label for="contact-phone">Call me</label>
      </div>

      <!-- nested-interactive: link nested inside a button -->
      <button type="submit"><a href="index.html">Submit</a></button>
    </form>
  </div>
</body>
</html>
