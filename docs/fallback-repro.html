<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fallback fixer reproduction</title>
</head>
<body>
  <!--
    Reproduces "Generate Fix — Built-in fallback fix didn't match this
    violation's markup" directly: the button carries an id (so locate_source
    resolves it uniquely via its id/class hard-gate — no ambiguity at all),
    but the OLD _fallback_patch's button-name branch only ever looked for a
    `class` attribute to re-find the element, so it failed at Generate Fix
    even though Locate Source had already succeeded.
  -->
  <button id="download-action" aria-label="Download Action">
    <svg width="16" height="16"><rect width="16" height="16" /></svg>
  </button>
</body>
</html>
