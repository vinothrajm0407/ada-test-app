<!doctype html>
<!-- html-has-lang: missing lang attribute -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ADA Test App</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #111; color: #333; }
    nav { background: #222; padding: 12px 20px; }
    nav a { color: #444; margin-right: 16px; text-decoration: none; }
    .content { padding: 20px; max-width: 800px; }
    .tiny-btn-play, .tiny-btn-stop, .tiny-btn-repeat { width: 14px; height: 14px; padding: 0; border: none; font-size: 8px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="media.html">Media</a>
  </nav>

  <div class="content">
    <h1>Media</h1>

    <!-- color-contrast: dark gray text on near-black background -->
    <p>Watch the latest product walkthrough below.</p>

    <!-- video-caption: no track element -->
    <video src="demo.mp4" controls width="320" height="180"></video>

    <!-- frame-title: iframe with no title -->
    <iframe src="https://example.com/embed" width="320" height="180"></iframe>

    <!-- autoplay audio with no visible controls -->
    <audio src="ambient.mp3" autoplay></audio>

    <!-- target-size: cluster of tiny icon-only buttons -->
    <div>
      <button class="tiny-btn-play">&#9654;</button>
      <button class="tiny-btn-stop">&#9724;</button>
      <button class="tiny-btn-repeat">&#8635;</button>
    </div>

    <!-- tabindex: positive tabindex anti-pattern -->
    <p><a href="index.html" tabindex="5">Back to home</a></p>
  </div>
</body>
</html>
