<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ADA Test App</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    nav { background: #222; padding: 12px 20px; }
    nav a { color: #444; margin-right: 16px; text-decoration: none; }
    .content { padding: 20px; max-width: 800px; }
    .price { color: #aaaaaa; background: #ffffff; }
    .grid { display: flex; gap: 12px; }
    .card { border: 1px solid #ddd; padding: 8px; width: 150px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="media.html">Media</a>
  </nav>

  <div class="content">
    <h1>Products</h1>

    <!-- label: input with no label, no aria-label, no placeholder -->
    <input type="text" class="filter-input">

    <div class="grid">
      <div class="card">
        <!-- image-alt: missing alt entirely -->
        <img src="product1.svg" width="100" height="100">
        <p class="price">$19.99</p>
        <!-- button-name: icon-only button, empty -->
        <button class="icon-btn"></button>
      </div>
      <div class="card">
        <!-- image-alt: alt is present but non-informative filler -->
        <img src="product2.svg" alt="image" width="100" height="100">
        <p class="price">$24.99</p>
        <button class="icon-btn"></button>
      </div>
      <div class="card">
        <img src="product3.svg" width="100" height="100">
        <p class="price">$9.99</p>
        <button class="icon-btn"></button>
      </div>
    </div>

    <!-- aria-allowed-attr / aria-required-attr: role=checkbox on a div without aria-checked -->
    <div role="checkbox" class="fav-toggle">Add to favorites</div>

    <!-- form-field-multiple-labels / label: two labels pointing at nothing useful -->
    <label for="sort">Sort by</label>
    <label for="sort">Order</label>
    <select id="sort2" class="sort-select">
      <option>Price: low to high</option>
      <option>Price: high to low</option>
    </select>
  </div>
</body>
</html>
